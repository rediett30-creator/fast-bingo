name: Build Fast Bingo Web

on:
  workflow_dispatch:
  push:
    paths:
      - 'fast_bingo_web/**'
      - '.github/workflows/build-web.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: fast_bingo_web
        run: flutter pub get

      - name: Build web
        working-directory: fast_bingo_web
        run: flutter build web --release

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: fast-bingo-web
          path: fast_bingo_web/build/web
git add fast_bingo_web/lib/config.dart .github/workflows/build-web.yml
git commit -m "Configure backend and add web build workflow"
git push origin main
